[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lncker"
version = "0.1.0"
description = "Tissue-specific lncRNA discovery and cis-neighborhood scoring from RNA-seq differential expression analysis."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yahel Godinez", email = "yahel.godinez@ibt.unam.mx" }]
# lncker itself imports only the standard library. `annotate` reaches NCBI /
# eggNOG-mapper / QuickGO over the network, but does so with urllib.
dependencies = []

[project.optional-dependencies]
# Test suite only. The package under test still has no runtime dependencies.
dev = ["pytest>=7"]
# Needed only by the upstream Snakemake workflow in snakemake/, not by lncker.
pipeline = ["snakemake>=8", "pandas", "numpy", "matplotlib", "pydeseq2"]

[project.scripts]
lncker = "lncker.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
